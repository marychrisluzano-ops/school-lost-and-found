
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - School Lost and Found</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border: 3px solid #D4AF37;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #8B0000;
        }

        p {
            text-align: center;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #8B0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #D4AF37;
            color: black;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #8B0000;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Contact Us</h1>

        <p>
            Do you have questions about a lost or found item?
            Send us your concern!
        </p>

        <label for="name">Full Name</label>
        <input type="text" id="name"
               placeholder="Enter your name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email"
               placeholder="Enter your email" required>

        <label for="message">Your Message</label>
        <textarea id="message" rows="5"
                  placeholder="Write your message here..."
                  required></textarea>

        <button type="button"
                onclick="alert('Thank you! This is a sample contact form. Messages are not sent yet.')">
            Send Message
        </button>

        <a class="back" href="LUZANO.MC.html">Back to Home</a>

    </div>

</body>
</html>
